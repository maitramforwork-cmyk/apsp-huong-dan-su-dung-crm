<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khóa Học: Quy Trình Base CRM Dành Cho Sales</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="course-layout">
        <!-- Menu Khoá Học -->
        <aside class="course-sidebar">
            <div class="course-logo">
                <i class="fa-solid fa-graduation-cap"></i> E-Learning
            </div>
            <div class="course-info">
                <h3>Quy Trình Bán Hàng & Base CRM</h3>
                <p>Khối Kinh Doanh Công Nghiệp</p>
                <div class="progress-container">
                    <div class="progress-text">Tiến độ: <span id="progress-text">0%</span></div>
                    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
                </div>
            </div>
            
            <ul class="toc-list" id="toc-list">
                <!-- Javascript renders table of contents here -->
            </ul>
        </aside>

        <!-- Khung Nội Dung Bài Học -->
        <main class="course-main">
            <header class="top-nav">
                <button class="menu-toggle" id="menu-toggle"><i class="fa-solid fa-bars"></i></button>
                <div class="course-breadcrumbs">Bài giảng / <span id="breadcrumb-title">...</span></div>
            </header>
            
            <div class="lesson-container">
                <article class="lesson-card" id="lesson-content">
                    <!-- Lesson HTML goes here -->
                </article>

                <div class="lesson-navigation">
                    <button class="btn-nav" id="btn-prev"><i class="fa-solid fa-arrow-left"></i> Bài Trước</button>
                    <button class="btn-nav btn-next" id="btn-next">Tiếp Theo <i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </div>
        </main>
    </div>

    <!-- Application Logic -->
    <script src="app.js"></script>
</body>
</html>
